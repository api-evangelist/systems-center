name: Systems Center
description: 'Systems Center, Inc. was a mainframe and enterprise systems-management
  software vendor best known for the NetMaster network-management product line. The
  company was acquired by Sterling Software of Dallas in a 1993 deal (approximately
  $185M), after which NetMaster was folded into Sterling''s data-communications
  portfolio and rebranded (Connect:Direct lineage); Sterling Software was itself
  acquired by Computer Associates in 2000. Systems Center was surfaced as a portfolio
  company of Battery Ventures and added to the API Evangelist network as a stub. An
  enrichment pass (2026-07-21) searched for any live website, developer portal, or
  API surface and found none: the company is defunct with no independent public
  presence, so no API artifacts apply.'
